version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: medical-cell-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: medical_cell_test
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: medical-cell-test-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - app-network

  # Application (uncomment when ready)
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: medical-cell-test-api
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   ports:
  #     - '${PORT:-3000}:${PORT:-3000}'
  #   depends_on:
  #     - mysql
  #     - redis
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   networks:
  #     - app-network

  # MailHog for email testing (development only)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: medical-cell-test-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge
